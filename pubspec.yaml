name: cloudgames_control
description: CloudGames Control – CGIntelligent ir CloudGames valdymas telefone.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: any
  flutter_secure_storage: any
  firebase_core: any
  firebase_messaging: any
  url_launcher: any

dev_dependencies:
  flutter_launcher_icons: any

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon.png
